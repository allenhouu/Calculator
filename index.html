<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="calc.js"></script>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Allen H Calculator</title>
</head>
<body>

<div class="calculator mx-auto">
    <input id="display" type="text" readonly>
    <div class="functions">
        <button class="btn" onclick="openP()">(</button>
        <button class="btn" onclick="closeP()">)</button>
        <button class="btn" onclick="sqrt()">√</button>
        <button class="btn" onclick="exponent()">^</button>
        <button class="btn" onclick="displayNum(7)">7</button>
        <button class="btn" onclick="displayNum(8)">8</button>
        <button class="btn" onclick="displayNum(9)">9</button>
        <button class="btn operators" onclick="addition()">+</button>
        <button class="btn" onclick="displayNum(4)">4</button>
        <button class="btn" onclick="displayNum(5)">5</button>
        <button class="btn" onclick="displayNum(6)">6</button>
        <button class="btn operators" onclick="subtraction()">-</button>
        <button class="btn" onclick="displayNum(1)">1</button>
        <button class="btn" onclick="displayNum(2)">2</button>
        <button class="btn" onclick="displayNum(3)">3</button>
        <button class="btn operators" onclick="multiplication()">*</button>
        <button class="btn" onclick="clearCalc()">C</button>
        <button class="btn" onclick="backspace()">CE</button>
        <button class="btn" onclick="decimal()">.</button>
        <button class="btn operators" onclick="division()">/</button>
        <button class="btn" onclick="enter()">=</button>
        <button class="btn" onclick="history()">HISTORY</button>
    </div>
</div>

</body>
</html>
