<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="calc.js"></script>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Allen H Calculator</title>
</head>
<body>

<div class="calculator mx-auto">
    <input id="display" readonly>
    <div class="functions">
        <button onclick="openP()">(</button>
        <button onclick="closeP()">)</button>
        <button onclick="sqrt()">√</button>
        <button onclick="exponent()">^</button>

        <button onclick="displayNum(7)">7</button>
        <button onclick="displayNum(8)">8</button>
        <button onclick="displayNum(9)">9</button>
        <button class="operators" onclick="addition()">&plus;</button>

        <button onclick="displayNum(4)">4</button>
        <button onclick="displayNum(5)">5</button>
        <button onclick="displayNum(6)">6</button>
        <button class="operators" onclick="subtraction()">&minus;</button>

        <button onclick="displayNum(1)">1</button>
        <button onclick="displayNum(2)">2</button>
        <button onclick="displayNum(3)">3</button>
        <button class="operators" onclick="multiplication()">&times;</button>

        <button onclick="clearCalc()">C</button>
        <button onclick="displayNum(0)">0</button>
        <button onclick="backspace()">CE</button>
        <button class="operators" onclick="division()">&div;</button>

        <button onclick="decimal()">.</button>
        <button onclick="enter()">&equals;</button>
        <button onclick="showHSTRY()">HSTRY</button>
    </div>
</div>

</body>
</html>
