<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="calc.js"></script>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Allen H Calculator</title>
</head>
<body>

<div class="display-box">
    <input type="text" id="display">
    <label for="display"></label>
</div>

<div class="container d-flex justify-content-center">
    <div class="row">
        <div class="col">
            <div class="btn-group">
                <div class="grid-container">
                    <div class="grid-item">
                        <button onclick="displayNum(7)">7</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="displayNum(8)">8</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="displayNum(9)">9</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="displayNum(4)">4</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="displayNum(5)">5</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="displayNum(6)">6</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="displayNum(1)">1</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="displayNum(2)">2</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="displayNum(3)">3</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="clear()">CLEAR</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="backspace()">backspace</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="addition()">+</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="subtraction()">-</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="division()">/</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="multiplication()">*</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="">.</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="">ENTER</button>
                    </div>
                    <div class="grid-item">
                        <button onclick="sqrt()">√</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
